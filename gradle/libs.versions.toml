[versions]
agp = "9.4.1"
kotlin = "2.4.20"
compileSdk = "37"
targetSdk = "37"
# PowerMonitor API (SystemHealthManager.getSupportedPowerMonitors) is public from API 35.
minSdk = "35"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
kotlinxCoroutines = "1.11.0"
junit = "4.13.2"
# org.json is part of Android; unit tests on the JVM need a real copy.
orgJson = "20260814"
# ADB client inside the app: pairs with the phone's own wireless debugging to run `pm grant` for itself.
libadb = "3.1.1"
sunSecurity = "1.1"
# TLS 1.3 keying-material export needed for ADB pairing; the platform copy only offers it through hidden API.
conscrypt = "2.7.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version.ref = "orgJson" }
libadb = { module = "com.github.MuntashirAkon:libadb-android", version.ref = "libadb" }
sun-security = { module = "com.github.MuntashirAkon:sun-security-android", version.ref = "sunSecurity" }
conscrypt = { module = "org.conscrypt:conscrypt-android", version.ref = "conscrypt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9 compiles Kotlin itself (built-in Kotlin); declaring the Compose compiler plugin with an explicit
# version also pins the Kotlin Gradle plugin version on the build classpath.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
